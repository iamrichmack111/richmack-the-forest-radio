name: Tagged Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: |
          zip -r "richmack-the-forest-radio-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" \
               "node_modules/*" \
               "playwright-report/*" \
               "test-results/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: richmack-the-forest-radio-${{ github.ref_name }}.zip
