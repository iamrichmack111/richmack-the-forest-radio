services:
  richmack-the-forest:
    build:
      context: .
      dockerfile: Dockerfile
    image: richmack-the-forest:latest
    container_name: richmack-the-forest
    restart: unless-stopped
    ports:
      - "${RICHMACK_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
